name: Build and publish ad-blocking geosite for Happ

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Parse the six filter sources
        run: python adblock/build_geosite.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build Xray geosite database
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git /tmp/domain-list-community
          mkdir -p /tmp/domain-list-community/data
          cp data/category-ads-user /tmp/domain-list-community/data/category-ads-user
          cd /tmp/domain-list-community
          go mod download
          go run . --datapath=./data
          test -s dlc.dat
          cp dlc.dat "$GITHUB_WORKSPACE/adblock/geosite.dat"

      - name: Verify generated geosite file
        run: |
          test -s adblock/geosite.dat
          ls -lh adblock/geosite.dat
          grep -q '^domain:' data/category-ads-user

      - name: Publish stable raw GitHub file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adblock/geosite.dat
          if ! git diff --cached --quiet; then
            git commit -m "Update Happ ad-blocking geosite database"
            git push
          else
            echo "Geosite database has not changed."
          fi

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: family-salahi-adblock-geosite-report
          path: |
            data/category-ads-user
            build-report.txt
          if-no-files-found: error
