name: Build ad-blocking geosite

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Parse the six filter sources
        run: python adblock/build_geosite.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build Xray geosite database
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git /tmp/domain-list-community
          mkdir -p /tmp/domain-list-community/data
          cp data/category-ads-user /tmp/domain-list-community/data/category-ads-user
          cd /tmp/domain-list-community
          go mod download
          go run . --datapath=./data
          test -s dlc.dat
          cp dlc.dat "$GITHUB_WORKSPACE/adblock/dlc.dat"

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: family-salahi-adblock-geosite
          path: |
            adblock/dlc.dat
            data/category-ads-user
            build-report.txt
          if-no-files-found: error
